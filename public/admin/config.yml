backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/cohealthnews
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short description (shows on cards and Google), widget: text }
      - { name: date, label: Publish date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: category, label: Category, widget: select, options: ["Nutrition", "Wellness", "Research", "Fitness", "Health"], default: "Health" }
      - { name: image, label: Cover image, widget: image, required: false }
      - { name: draft, label: Draft (hide from site), widget: boolean, default: false }
      - { name: body, label: Article, widget: markdown }
